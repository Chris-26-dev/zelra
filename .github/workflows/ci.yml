name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check (app)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type-check (Convex functions)
        run: npx tsc --noEmit -p convex/tsconfig.json

      - run: npm run lint

      # Convex functions run in-memory via convex-test: no deployment or secrets needed.
      - name: Security regression tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholder: the build only needs a syntactically valid URL, never a real deployment.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder-ci.convex.cloud
          NEXT_TELEMETRY_DISABLED: 1

      - name: Fail on critical production advisories
        run: npm audit --omit=dev --audit-level=critical
